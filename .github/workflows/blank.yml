name: My-first-commit-job
on: workflow_dispatch
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: hello-step
        run: |
          echo "this is my second line"
          echo "this is my third line"
  Build:
    runs-on: ubuntu-latest
    needs: hello   ## it will execute if hello job is success.. or its not execute.
    steps:
      - name: buid step
        run: echo "this is a build step"
  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: test step
        run: echo "this is a test cases"
  Deploy:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: deploy stage
        run: echo "deploying the code to dev environment"
            
        



